# Constrained official catalogue discovery for specialty/regulatory authorities.
# This file is loaded automatically by `duc-agentic sources status/sync config/sources.yaml`.
# Crawlers remain on explicitly allowed official hosts, respect robots.txt, and do not bypass access controls.
raw_root: ../data/raw
manifest_path: ../data/raw/manifests/source_manifest.jsonl

http:
  timeout_seconds: 90
  max_retries: 4
  user_agent: DUC-Agentic-Mining/0.1 research-source-acquisition

catalogues:
  uspstf:
    enabled: true
    canonical_source: USPSTF
    output: primary/uspstf/uspstf_guidance.jsonl
    seed_urls:
      - https://www.uspreventiveservicestaskforce.org/uspstf/recommendation-topics
      - https://www.uspreventiveservicestaskforce.org/uspstf/topic_search_results
    allowed_hosts: [www.uspreventiveservicestaskforce.org]
    crawl_patterns:
      - '/uspstf/recommendation'
      - '/uspstf/topic_search_results'
    record_patterns:
      - '/uspstf/recommendation/'
    required_text_patterns: ['USPSTF|Preventive Services Task Force']
    max_depth: 2
    max_pages: 220
    max_records: 160
    rate_limit_per_second: 1

  idsa:
    enabled: true
    canonical_source: IDSA
    output: primary/idsa/idsa_guidance.jsonl
    seed_urls:
      - https://www.idsociety.org/practice-guideline/all-practice-guidelines
    allowed_hosts: [www.idsociety.org, idsociety.org]
    crawl_patterns:
      - '/practice-guideline/'
      - '/guidelines/'
      - '/practice-guideline/all-practice-guidelines'
    record_patterns:
      - '/practice-guideline/.+'
      - '/guidelines/.+'
    deny_patterns: ['/archived-guidelines']
    required_text_patterns: ['IDSA|Infectious Diseases Society of America']
    max_depth: 2
    max_pages: 260
    max_records: 220
    rate_limit_per_second: 1

  ontario_health:
    enabled: true
    canonical_source: Ontario Health / Cancer Care Ontario
    output: primary/ontario_health/ontario_health_guidance.jsonl
    seed_urls:
      - https://www.cancercareontario.ca/en/guidelines-advice
      - https://www.cancercareontario.ca/en/guidelines-advice/cancer-continuum
    allowed_hosts: [www.cancercareontario.ca, cancercareontario.ca]
    crawl_patterns:
      - '/en/guidelines-advice'
    record_patterns:
      - '/en/guidelines-advice/.+'
    required_text_patterns: ['Cancer Care Ontario|Ontario Health']
    max_depth: 3
    max_pages: 420
    max_records: 350
    rate_limit_per_second: 1
    allow_pdfs: true

  acr:
    enabled: true
    canonical_source: ACR
    output: primary/acr/acr_guidance.jsonl
    seed_urls:
      - https://www.acr.org/clinical-resources/clinical-tools-and-reference/appropriateness-criteria
      - https://acsearch.acr.org/list
    allowed_hosts: [www.acr.org, acr.org, acsearch.acr.org]
    crawl_patterns:
      - 'appropriateness-criteria'
      - '^https://acsearch\.acr\.org/(list|docs/)'
    record_patterns:
      - '^https://acsearch\.acr\.org/docs/'
    required_text_patterns: ['ACR|American College of Radiology|Appropriateness Criteria']
    max_depth: 2
    max_pages: 360
    max_records: 300
    rate_limit_per_second: 1
    allow_pdfs: true

  acc_aha:
    enabled: true
    canonical_source: ACC / AHA
    output: primary/acc_aha/acc_aha_guidance.jsonl
    seed_urls:
      - https://www.acc.org/guidelines
      - https://professional.heart.org/en/guidelines-and-statements
      - https://professional.heart.org/en/guidelines-statements
    allowed_hosts: [www.acc.org, acc.org, professional.heart.org, www.heart.org, heart.org]
    crawl_patterns:
      - '/guidelines'
      - '/guideline'
      - '/clinical-policy'
      - '/guidelines-and-statements'
      - '/guidelines-statements'
    record_patterns:
      - '/guidelines/.+'
      - '/guideline/.+'
      - '/guidelines-and-statements/.+'
      - '/guidelines-statements/.+'
    required_text_patterns: ['American College of Cardiology|American Heart Association|ACC/AHA|AHA/ACC']
    max_depth: 2
    max_pages: 420
    max_records: 320
    rate_limit_per_second: 1
    allow_pdfs: true

  asco:
    enabled: true
    canonical_source: ASCO
    output: primary/asco/asco_guidance.jsonl
    seed_urls:
      - https://www.asco.org/practice-patients/guidelines
      - https://www.asco.org/guideline-methodology
    allowed_hosts: [www.asco.org, asco.org]
    crawl_patterns:
      - '/guidelines'
      - '/guideline'
    record_patterns:
      - '/guidelines/.+'
      - '/guideline/.+'
    required_text_patterns: ['ASCO|American Society of Clinical Oncology']
    max_depth: 2
    max_pages: 300
    max_records: 220
    rate_limit_per_second: 0.75
    allow_pdfs: false

  acog:
    enabled: true
    canonical_source: ACOG
    output: primary/acog/acog_guidance.jsonl
    seed_urls:
      - https://www.acog.org/clinical/clinical-guidance
      - https://www.acog.org/clinical/clinical-guidance/clinical-practice-update
    allowed_hosts: [www.acog.org, acog.org]
    crawl_patterns:
      - '/clinical/clinical-guidance/'
    record_patterns:
      - '/clinical/clinical-guidance/.+'
    required_text_patterns: ['ACOG|American College of Obstetricians and Gynecologists']
    max_depth: 3
    max_pages: 420
    max_records: 320
    rate_limit_per_second: 0.75
    allow_pdfs: false

  aap:
    enabled: true
    canonical_source: AAP
    output: primary/aap/aap_guidance.jsonl
    seed_urls:
      - https://www.aap.org/en/quality-improvement/clinical-practice-guidelines/
    allowed_hosts: [www.aap.org, aap.org, publications.aap.org]
    crawl_patterns:
      - 'clinical-practice-guidelines'
      - '/pediatrics/article/'
    record_patterns:
      - 'clinical-practice-guidelines/.+'
      - '/pediatrics/article/.+'
    required_text_patterns: ['American Academy of Pediatrics|AAP|Clinical Practice Guideline']
    max_depth: 2
    max_pages: 260
    max_records: 180
    rate_limit_per_second: 0.75
    allow_pdfs: false

  kdigo:
    enabled: true
    canonical_source: KDIGO
    output: primary/kdigo/kdigo_guidance.jsonl
    seed_urls:
      - https://kdigo.org/guidelines/
    allowed_hosts: [kdigo.org, www.kdigo.org]
    crawl_patterns:
      - '/guidelines/'
      - '\.pdf$'
    record_patterns:
      - '/guidelines/.+'
      - '\.pdf$'
    required_text_patterns: ['KDIGO|Kidney Disease: Improving Global Outcomes|Clinical Practice Guideline']
    max_depth: 3
    max_pages: 300
    max_records: 200
    rate_limit_per_second: 1
    allow_pdfs: true

  gina:
    enabled: true
    canonical_source: GINA
    output: primary/gina/gina_guidance.jsonl
    seed_urls:
      - https://ginasthma.org/reports/
      - https://ginasthma.org/2026-gina-strategy-report/
    allowed_hosts: [ginasthma.org, www.ginasthma.org]
    crawl_patterns:
      - '/reports/'
      - '/20[0-9]{2}-gina-'
      - '/severe-asthma'
      - '/summary-guide'
    record_patterns:
      - '/20[0-9]{2}-gina-'
      - '/severe-asthma'
      - '/summary-guide'
    required_text_patterns: ['GINA|Global Initiative for Asthma']
    max_depth: 2
    max_pages: 120
    max_records: 80
    rate_limit_per_second: 0.75
    # Public landing-page text only; do not mirror protected report PDFs.
    allow_pdfs: false

  gold:
    enabled: true
    canonical_source: GOLD
    output: primary/gold/gold_guidance.jsonl
    seed_urls:
      - https://goldcopd.org/2026-gold-report-and-pocket-guide/
    allowed_hosts: [goldcopd.org, www.goldcopd.org]
    crawl_patterns:
      - '/20[0-9]{2}-gold-'
      - '/gold-report'
      - '/pocket-guide'
    record_patterns:
      - '/20[0-9]{2}-gold-'
      - '/gold-report'
      - '/pocket-guide'
    required_text_patterns: ['GOLD|Global Initiative for Chronic Obstructive Lung Disease|COPD']
    max_depth: 2
    max_pages: 100
    max_records: 60
    rate_limit_per_second: 0.75
    # Public landing-page text only; do not mirror restricted report PDFs.
    allow_pdfs: false

  acep:
    enabled: true
    canonical_source: ACEP
    output: primary/acep/acep_guidance.jsonl
    seed_urls:
      - https://www.acep.org/clinicalpolicies/
    allowed_hosts: [www.acep.org, acep.org]
    crawl_patterns:
      - '/clinicalpolicies/'
      - '/clinical-policies/'
      - '/siteassets/.+\.pdf$'
    record_patterns:
      - '/clinicalpolicies/.+'
      - '/clinical-policies/.+'
      - '/siteassets/.+clinical.+\.pdf$'
    required_text_patterns: ['ACEP|American College of Emergency Physicians|Clinical Policy']
    max_depth: 2
    max_pages: 260
    max_records: 180
    rate_limit_per_second: 1
    allow_pdfs: true

  resuscitation:
    enabled: true
    canonical_source: Resuscitation Council UK / ILCOR
    output: primary/resuscitation/resuscitation_guidance.jsonl
    seed_urls:
      - https://www.resus.org.uk/professional-library/2025-resuscitation-guidelines
    allowed_hosts: [www.resus.org.uk, resus.org.uk]
    crawl_patterns:
      - '/professional-library/2025-resuscitation-guidelines'
      - '\.pdf$'
    record_patterns:
      - '/professional-library/2025-resuscitation-guidelines/.+'
      - '\.pdf$'
    required_text_patterns: ['Resuscitation Council UK|ILCOR|resuscitation']
    max_depth: 3
    max_pages: 180
    max_records: 120
    rate_limit_per_second: 1
    allow_pdfs: true

  mhra:
    enabled: true
    canonical_source: MHRA
    output: regulatory/mhra/mhra_safety.jsonl
    seed_urls:
      - https://www.gov.uk/drug-safety-update
      - https://www.gov.uk/government/collections/medicines-and-medical-devices-product-specific-information
    allowed_hosts: [www.gov.uk, gov.uk]
