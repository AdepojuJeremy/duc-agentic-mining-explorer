    record_patterns:
      - '/drug-safety-update/.+'
      - '/drug-device-alerts/.+'
      - '/government/publications/.+'
    required_text_patterns: ['Medicines and Healthcare products Regulatory Agency|MHRA']
    max_depth: 3
    max_pages: 500
    max_records: 400
    rate_limit_per_second: 1.5
    allow_pdfs: true

  ema:
    enabled: true
    canonical_source: EMA
    output: regulatory/ema/ema_safety.jsonl
    seed_urls:
      - https://www.ema.europa.eu/en/medicines
      - https://www.ema.europa.eu/en/about-us/what-we-do/safety-medicines
      - https://www.ema.europa.eu/en/human-regulatory-overview/post-authorisation/pharmacovigilance-post-authorisation/medication-errors/recommendations-medication-errors
    allowed_hosts: [www.ema.europa.eu, ema.europa.eu]
    crawl_patterns:
      - '/en/medicines/human/EPAR/'
      - '/en/human-regulatory-overview/'
      - '/en/about-us/what-we-do/safety-medicines'
    record_patterns:
      - '/en/medicines/human/EPAR/.+'
      - '/en/human-regulatory-overview/.+'
    required_text_patterns: ['European Medicines Agency|EMA|medicine']
    max_depth: 2
    max_pages: 520
    max_records: 420
    rate_limit_per_second: 1
    allow_pdfs: false

  ecdc:
