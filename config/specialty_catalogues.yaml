  ukhsa:
    enabled: true
    canonical_source: UKHSA
    output: primary/ukhsa/ukhsa_guidance.jsonl
    seed_urls:
      - https://www.gov.uk/government/organisations/uk-health-security-agency
      - https://www.gov.uk/government/collections/ukhsa-strategies
    allowed_hosts: [www.gov.uk, gov.uk]
    crawl_patterns:
      - '/government/publications/'
      - '/government/collections/'
      - '/guidance/'
    record_patterns:
      - '/government/publications/.+'
      - '/guidance/.+'
    required_text_patterns: ['UK Health Security Agency|UKHSA']
    max_depth: 3
    max_pages: 420
