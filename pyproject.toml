[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "duc-agentic-mining-explorer"
version = "0.1.0"
description = "Agentic source mining, validation, vignette construction, and independent grounding review for DUC-style datasets."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "DUC team"}]
dependencies = [
  "openai>=1.99.0",
  "pydantic>=2.10",
  "PyYAML>=6.0.2",
  "typer>=0.15",
  "rich>=13.9",
  "pypdf>=5.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.9",
]

[project.scripts]
duc-agentic = "duc_agentic_mining.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/duc_agentic_mining"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Keep CI focused on concrete syntax/name errors. Broader style families are
# intentionally not release blockers for this research/data-production tool.
select = ["E4", "E7", "E9", "F"]
